<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local AI Agent Web Console</title>

  <!-- 1. Markdown Parser & Code Syntax Highlighting via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --chat-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --user-msg: #2563eb;
      --agent-msg: #182232;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .btn-clear {
      background: #dc2626;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .btn-clear:hover {
      background: #b91c1c;
    }

    #chat {
      background: var(--chat-bg);
      border-radius: 12px;
      padding: 24px;
      min-height: 450px;
      max-height: 650px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid var(--border-color);
    }

    .msg {
      padding: 12px 18px;
      border-radius: 10px;
      width: fit-content;
      max-width: 85%;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .user {
      background: var(--user-msg);
      align-self: flex-end;
      color: white;
      white-space: pre-wrap;
    }

    .agent {
      background: var(--agent-msg);
      border: 1px solid var(--border-color);
      align-self: flex-start;
      color: #e2e8f0;
      width: 90%;
    }

    .action {
      background: #451a03;
      color: #fef08a;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85em;
      align-self: flex-start;
      border: 1px solid #78350f;
    }

    .action-output {
      background: #064e3b;
      color: #a7f3d0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85em;
      align-self: flex-start;
      border: 1px solid #065f46;
    }

    .error {
      background: #7f1d1d;
      color: #fecaca;
      align-self: flex-start;
    }

    /* Markdown Engine Styling Inside Agent Messages */
    .markdown-body p { margin: 0 0 12px 0; }
    .markdown-body p:last-child { margin-bottom: 0; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      margin: 16px 0 8px 0;
      font-weight: 600;
      color: #fff;
    }
    .markdown-body ul, .markdown-body ol {
      margin: 0 0 12px 0;
      padding-left: 24px;
    }
    .markdown-body li { margin-bottom: 4px; }
    .markdown-body code:not(pre code) {
      background: #0f172a;
      color: #38bdf8;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 0.88em;
    }
    .markdown-body pre {
      background: #090d16 !important;
      padding: 14px;
      border-radius: 8px;
      overflow-x: auto;
      border: 1px solid var(--border-color);
      margin: 12px 0;
    }
    .markdown-body pre code {
      background: transparent !important;
      padding: 0;
      font-size: 0.88em;
    }
    .markdown-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      text-align: left;
    }
    .markdown-body th { background: #0f172a; }

    .input-box { display: flex; gap: 10px; margin-top: 20px; }
    input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--chat-bg);
      color: white;
      font-size: 1rem;
    }
    input:focus { outline: 2px solid var(--user-msg); }
    button.btn-send {
      padding: 12px 24px;
      background: var(--user-msg);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }
    button.btn-send:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <div class="header-container">
    <h2>🤖 Local AI Agent Console (`llama3.2`)</h2>
    <button class="btn-clear" onclick="clearClientMemory()">Clear Memory</button>
  </div>

  <div id="chat"></div>

  <div class="input-box">
    <input 
      type="text" 
      id="prompt" 
      placeholder="Ask a question or request a system action..." 
      onkeydown="if(event.key === 'Enter') sendPrompt()"
    />
    <button class="btn-send" onclick="sendPrompt()">Send</button>
  </div>

  <script>
    // 1. Configure Marked.js for Code Highlighting
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true
    });

    // 2. Load Existing Memory from Browser's localStorage
    let conversationHistory = JSON.parse(localStorage.getItem('agent_history') || '[]');

    window.onload = () => {
      renderHistoryUI();
    };

    function renderHistoryUI() {
      const chat = document.getElementById('chat');
      chat.innerHTML = '';
      
      for (const msg of conversationHistory) {
        if (msg.role === 'user') {
          chat.innerHTML += `<div class="msg user">${escapeHtml(msg.content)}</div>`;
        } else if (msg.role === 'assistant' && msg.content) {
          const formattedHtml = marked.parse(msg.content);
          chat.innerHTML += `<div class="msg agent markdown-body">💡 ${formattedHtml}</div>`;
        }
      }
      hljs.highlightAll();
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendPrompt() {
      const input = document.getElementById('prompt');
      const chat = document.getElementById('chat');
      const prompt = input.value.trim();
      if (!prompt) return;

      // Render User Message directly into DOM
      chat.innerHTML += `<div class="msg user">${escapeHtml(prompt)}</div>`;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      // Client-Side Context Slicing: Only send the last 10 messages to keep request payload bounded
      const MAX_HISTORY_TURNS = 10;
      const trimmedHistory = conversationHistory.slice(-MAX_HISTORY_TURNS);

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, history: trimmedHistory })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          const chunks = decoder.decode(value).split('\n\n');
          for (const chunk of chunks) {
            if (!chunk.trim()) continue;
            const { type, payload } = JSON.parse(chunk.replace('data: ', ''));

            if (type === 'action') {
              chat.innerHTML += `<div class="msg action">⚙️ ${escapeHtml(payload)}</div>`;
            } else if (type === 'action_output') {
              chat.innerHTML += `<div class="msg action-output">📦 ${escapeHtml(payload)}</div>`;
            } else if (type === 'message') {
              const formattedHtml = marked.parse(payload);
              chat.innerHTML += `<div class="msg agent markdown-body">💡 ${formattedHtml}</div>`;
            } else if (type === 'history_update') {
              // 3. Store updated memory array back into localStorage
              conversationHistory = payload;
              localStorage.setItem('agent_history', JSON.stringify(conversationHistory));
            } else if (type === 'error') {
              chat.innerHTML += `<div class="msg error">❌ ${escapeHtml(payload)}</div>`;
            }

            hljs.highlightAll();
            chat.scrollTop = chat.scrollHeight;
          }
        }
      } catch (err) {
        chat.innerHTML += `<div class="msg error">❌ Connection failed: ${err.message}</div>`;
      }
    }

    function clearClientMemory() {
      localStorage.removeItem('agent_history');
      conversationHistory = [];
      document.getElementById('chat').innerHTML = '';
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
