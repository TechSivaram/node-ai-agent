<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local AI Agent Web Console</title>

  <!-- Markdown Parser & Code Syntax Highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --chat-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --user-msg: #2563eb;
      --agent-msg: #182232;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    /* LOGIN SCREEN - Visible by default */
    #login-view {
      display: block;
      background: var(--chat-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 30px;
      max-width: 400px;
      margin: 80px auto;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .form-group input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #0f172a;
      color: white;
      box-sizing: border-box;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: var(--user-msg);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    .login-error {
      color: #fecaca;
      background: #7f1d1d;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      display: none;
    }

    /* CHAT CONSOLE - Hidden until login succeeds */
    #chat-view { 
      display: none; 
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .user-badge {
      font-size: 0.85rem;
      color: #94a3b8;
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .btn-action {
      background: #dc2626;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      margin-left: 8px;
    }

    #chat {
      background: var(--chat-bg);
      border-radius: 12px;
      padding: 24px;
      min-height: 450px;
      max-height: 600px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid var(--border-color);
    }

    .msg {
      padding: 12px 18px;
      border-radius: 10px;
      width: fit-content;
      max-width: 85%;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .user { background: var(--user-msg); align-self: flex-end; color: white; white-space: pre-wrap; }
    .agent { background: var(--agent-msg); border: 1px solid var(--border-color); align-self: flex-start; color: #e2e8f0; width: 90%; }
    .action { background: #451a03; color: #fef08a; font-family: monospace; font-size: 0.85em; align-self: flex-start; }
    .action-output { background: #064e3b; color: #a7f3d0; font-family: monospace; font-size: 0.85em; align-self: flex-start; }
    .error { background: #7f1d1d; color: #fecaca; align-self: flex-start; }

    .markdown-body p { margin: 0 0 12px 0; }
    .markdown-body pre { background: #090d16 !important; padding: 14px; border-radius: 8px; overflow-x: auto; }

    .input-box { display: flex; gap: 10px; margin-top: 20px; }
    .input-box input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--chat-bg); color: white; }
    .btn-send { padding: 12px 24px; background: var(--user-msg); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>

  <!-- 1. LOGIN SCREEN -->
  <div id="login-view">
    <h2 style="margin-top: 0; text-align: center;">🔐 Login</h2>
    <div id="login-error" class="login-error"></div>
    <form onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="admin or viewer" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="admin123 or user123" required />
      </div>
      <button type="submit" class="btn-login">Sign In</button>
    </form>
  </div>

  <!-- 2. CHAT CONSOLE -->
  <div id="chat-view">
    <div class="header-container">
      <h2>🤖 NodeAgent Console</h2>
      <div>
        <span id="user-badge" class="user-badge"></span>
        <button class="btn-action" style="background: #475569;" onclick="clearClientMemory()">Clear Memory</button>
        <button class="btn-action" onclick="logout()">Logout</button>
      </div>
    </div>

    <div id="chat"></div>

    <div class="input-box">
      <input type="text" id="prompt" placeholder="Ask a question or request an action..." onkeydown="if(event.key === 'Enter') sendPrompt()" />
      <button class="btn-send" onclick="sendPrompt()">Send</button>
    </div>
  </div>

  <script>
    // Safe initialization
    if (typeof marked !== 'undefined') {
      marked.setOptions({ breaks: true });
    }

    let conversationHistory = JSON.parse(localStorage.getItem('agent_history') || '[]');

    // Check token on initial load
    document.addEventListener('DOMContentLoaded', () => {
      debugger;
      const token = localStorage.getItem('auth_token');
      if (token) {
        showChatInterface();
      } else {
        showLoginInterface();
      }
    });

    function showLoginInterface() {
      document.getElementById('login-view').style.display = 'block';
      document.getElementById('chat-view').style.display = 'none';
    }

    function showChatInterface() {
      document.getElementById('login-view').style.display = 'none';
      document.getElementById('chat-view').style.display = 'block';

      const user = JSON.parse(localStorage.getItem('auth_user') || '{}');
      document.getElementById('user-badge').innerText = `👤 ${user.username || 'User'} (${user.role || 'role'})`;

      renderHistoryUI();
    }

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('login-error');

      errorDiv.style.display = 'none';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.token) {
          localStorage.setItem('auth_token', data.token);
          localStorage.setItem('auth_user', JSON.stringify({ username: data.username, role: data.role }));
          showChatInterface();
        } else {
          errorDiv.innerText = data.error || 'Login failed';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.innerText = 'Connection error. Check server.';
        errorDiv.style.display = 'block';
      }
    }

    function logout() {
      localStorage.removeItem('auth_token');
      localStorage.removeItem('auth_user');
      showLoginInterface();
    }

    function renderHistoryUI() {
      const chat = document.getElementById('chat');
      chat.innerHTML = '';
      for (const msg of conversationHistory) {
        if (msg.role === 'user') {
          chat.innerHTML += `<div class="msg user">${escapeHtml(msg.content)}</div>`;
        } else if (msg.role === 'assistant' && msg.content) {
          const formattedHtml = typeof marked !== 'undefined' ? marked.parse(msg.content) : msg.content;
          chat.innerHTML += `<div class="msg agent markdown-body">💡 ${formattedHtml}</div>`;
        }
      }
      if (typeof hljs !== 'undefined') hljs.highlightAll();
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendPrompt() {
      const input = document.getElementById('prompt');
      const chat = document.getElementById('chat');
      const prompt = input.value.trim();
      const token = localStorage.getItem('auth_token');

      if (!prompt || !token) return;

      chat.innerHTML += `<div class="msg user">${escapeHtml(prompt)}</div>`;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      const trimmedHistory = conversationHistory.slice(-10);

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ prompt, history: trimmedHistory })
        });

        if (response.status === 401 || response.status === 403) {
          alert('Session expired. Please log in again.');
          logout();
          return;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          const chunks = decoder.decode(value).split('\n\n');
          for (const chunk of chunks) {
            if (!chunk.trim()) continue;
            const { type, payload } = JSON.parse(chunk.replace('data: ', ''));

            if (type === 'action') {
              chat.innerHTML += `<div class="msg action">⚙️ ${escapeHtml(payload)}</div>`;
            } else if (type === 'action_output') {
              chat.innerHTML += `<div class="msg action-output">📦 ${escapeHtml(payload)}</div>`;
            } else if (type === 'message') {
              const formattedHtml = typeof marked !== 'undefined' ? marked.parse(payload) : payload;
              chat.innerHTML += `<div class="msg agent markdown-body">💡 ${formattedHtml}</div>`;
            } else if (type === 'history_update') {
              conversationHistory = payload;
              localStorage.setItem('agent_history', JSON.stringify(conversationHistory));
            } else if (type === 'error') {
              chat.innerHTML += `<div class="msg error">❌ ${escapeHtml(payload)}</div>`;
            }

            if (typeof hljs !== 'undefined') hljs.highlightAll();
            chat.scrollTop = chat.scrollHeight;
          }
        }
      } catch (err) {
        chat.innerHTML += `<div class="msg error">❌ Connection failed: ${err.message}</div>`;
      }
    }

    function clearClientMemory() {
      localStorage.removeItem('agent_history');
      conversationHistory = [];
      document.getElementById('chat').innerHTML = '';
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
